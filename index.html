<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Borang Aktiviti &amp; Kehadiran Murid</title>
<style>
  :root{
    --navy:#123049;
    --navy-deep:#0a1f30;
    --navy-dark:#0a1f30;
    --navy-mid:#1c4666;
    --coral:#d9714a;
    --coral-deep:#b8582f;
    --gold:#c28f2c;
    --gold-light:#ecdcae;
    --paper:#f7f3ea;
    --card:#ffffff;
    --ink:#20242b;
    --ink-soft:#6b6459;
    --line:#e1d9c7;
    --danger:#a23b3b;
    --danger-bg:#f6e9e9;
    --good:#3c6e4d;
  }
  *{box-sizing:border-box;}
  button,input,select,textarea{font-family:inherit;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;margin:0;}
  #app{max-width:980px;margin:0 auto 60px;padding:0;}
  .content-pad{padding:20px 16px 0;max-width:948px;margin:0 auto;}

  /* ---- Masthead ---- */
  .masthead{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--navy) 0%,var(--navy-deep) 100%);
    padding:22px 18px 26px;margin-bottom:22px;color:#fff;}
  .masthead::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
    background:repeating-linear-gradient(-38deg,rgba(255,255,255,.9) 0 3px,transparent 3px 26px);
    -webkit-mask-image:linear-gradient(100deg,#000 0%,#000 45%,transparent 85%);
    mask-image:linear-gradient(100deg,#000 0%,#000 45%,transparent 85%);}
  .masthead-inner{position:relative;max-width:948px;margin:0 auto;display:flex;
    align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .appbar{display:flex;align-items:center;justify-content:space-between;width:100%;gap:14px;flex-wrap:wrap;}
  .appbar .brand{display:flex;align-items:center;gap:12px;}
  .emblem{width:46px;height:46px;border-radius:50%;background:#fff;
    flex:none;display:block;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.25);}
  .appbar h1{font-size:21px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:-.01em;}
  .appbar .sub{font-size:12.5px;color:var(--gold-light);margin-top:2px;}
  .btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:9px 14px;
    border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap;
    transition:transform .12s ease,box-shadow .12s ease,background .15s ease;}
  .btn:hover{background:var(--navy-mid);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;color:var(--navy);}
  .btn.secondary:hover{background:#eef2f6;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn.danger{background:var(--danger);border-color:var(--danger);}
  .btn.danger.outline{background:transparent;color:var(--danger);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.gold:hover{background:var(--coral-deep);border-color:var(--coral-deep);}
  .btn.on-dark{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(2px);}
  .btn.on-dark:hover{background:rgba(255,255,255,.22);}
  .btn.on-dark.primary{background:var(--gold);border-color:var(--gold);color:#1c1204;font-weight:700;}
  .btn.on-dark.primary:hover{background:#d6a13a;}
  .btn.small{padding:5px 10px;font-size:12.5px;border-radius:6px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---- List view ---- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input[type=search]{flex:1;min-width:160px;padding:10px 14px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;background:#fff;}
  .toolbar input[type=search]:focus{outline:none;border-color:var(--navy-mid);box-shadow:0 0 0 3px rgba(28,70,102,.12);}
  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;border:1px dashed var(--line);
    border-radius:10px;background:#fff;}
  .empty b{color:var(--ink);}
  .card-rec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--coral);
    border-radius:8px;padding:14px 16px 14px 14px;margin-bottom:12px;}
  .card-rec.alt{border-left-color:var(--gold);}
  .card-rec .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .card-rec .tarikh{font-weight:700;color:var(--navy);font-size:15.5px;letter-spacing:-.005em;}
  .card-rec .aktiviti{margin-top:3px;font-size:14px;color:var(--ink);}
  .card-rec .meta{margin-top:8px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;}
  .card-rec .actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .pill{display:inline-block;background:var(--navy);color:#fff;border-radius:5px;
    padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;}

  /* ---- Editor ---- */
  .section{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin-bottom:14px;}
  .section h2{font-size:15px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--line);
    padding-bottom:9px;margin-bottom:14px;position:relative;}
  .section h2::before{content:"";position:absolute;left:0;bottom:-2px;width:34px;height:2px;background:var(--coral);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  input[type=text],input[type=date],textarea,select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  input[type=text]:focus,input[type=date]:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--navy-mid);box-shadow:0 0 0 3px rgba(28,70,102,.12);}
  textarea{resize:vertical;min-height:44px;}
  .field{margin-bottom:12px;}
  .row-line{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .row-line input{flex:1;}
  .row-line .num{width:26px;text-align:center;color:var(--ink-soft);font-size:13px;flex:none;}
  .stud-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px;
    padding:6px 8px;background:#f7f5ef;border-radius:6px;}
  .stud-row .num{width:20px;flex:none;text-align:center;color:var(--ink-soft);font-size:12.5px;}
  .stud-row .stud-name{flex:2;font-weight:600;}
  .stud-row .stud-tkt{flex:1;color:var(--ink-soft);font-size:11.5px;text-align:right;}
  .picker-row{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap;}
  .picker-row .tf-select{flex:1;min-width:132px;}
  .picker-row .stud-select{flex:1;min-width:160px;}
  .manual-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .manual-row input{flex:1;min-width:120px;}
  .pick-toolbar{display:flex;justify-content:space-between;align-items:center;
    gap:8px;margin:6px 0;flex-wrap:wrap;}
  .pick-count{font-size:12px;color:var(--ink-soft);}
  .pick-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
    background:#fbf9f4;}
  .pick-row{display:flex;align-items:center;gap:9px;padding:6px 10px;font-size:12.5px;
    border-bottom:1px solid var(--line);cursor:pointer;}
  .pick-row:last-child{border-bottom:none;}
  .pick-row:hover{background:#f1ede1;}
  .pick-row input[type=checkbox]{flex:none;width:16px;height:16px;accent-color:var(--navy);}
  .pick-row .pick-name{flex:1;}
  .pick-row .pick-tkt{color:var(--ink-soft);font-size:11px;flex:none;}
  .ac-wrap{position:relative;}
  .ac-suggest{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 20px rgba(10,20,35,.14);max-height:220px;overflow-y:auto;}
  .ac-suggest.show{display:block;}
  .ac-item{padding:8px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover,.ac-item.active{background:#f1ede1;}
  .ac-item .ac-bidang{color:var(--ink-soft);font-size:11.5px;margin-left:6px;}
  .ac-empty{padding:9px 12px;font-size:13px;color:var(--ink-soft);}
  .cat-block{margin-bottom:16px;}
  .cat-title{font-weight:700;font-size:13.5px;color:var(--navy-dark);margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;}
  .iconbtn{background:transparent;border:none;cursor:pointer;color:var(--danger);font-size:17px;
    line-height:1;padding:2px 6px;flex:none;}
  .iconbtn:hover{opacity:.7;}
  .addlink{background:none;border:1px dashed var(--line);color:var(--navy);border-radius:7px;
    padding:7px 10px;font-size:13px;cursor:pointer;width:100%;text-align:left;font-weight:600;}
  .addlink:hover{background:#f3f6f9;}
  .footbar{position:sticky;bottom:12px;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(10,20,35,.14);
    padding:12px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:-6px;margin-bottom:10px;}
  .logo-row{display:flex;align-items:center;gap:12px;}
  .logo-preview{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);
    object-fit:contain;background:#fff;flex:none;}
  .logo-placeholder{width:52px;height:52px;border-radius:8px;border:1px dashed var(--line);
    flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:10px;text-align:center;}

  /* ---- Print / preview document ---- */
  .doc-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 26px 30px;}
  .doc-head{display:flex;gap:14px;align-items:flex-start;border-bottom:2.5px solid var(--navy);
    padding-bottom:12px;margin-bottom:16px;}
  .doc-head img,.doc-head .logo-placeholder{width:56px;height:56px;}
  .doc-head .school-name{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:16px;color:var(--navy-dark);letter-spacing:.3px;}
  .doc-head .school-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .doc-head .school-addr{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
  .doc-panitia{text-align:center;font-weight:700;text-decoration:underline;margin:6px 0 14px;
    font-size:14px;letter-spacing:.5px;}
  .doc-desc{font-size:13px;margin-bottom:14px;line-height:1.5;}
  .doc-meta{display:grid;grid-template-columns:120px 1fr;row-gap:4px;font-size:13px;margin-bottom:12px;}
  .doc-meta .k{font-weight:600;}
  .doc-guru{font-size:13px;margin-bottom:16px;}
  .doc-guru b{display:block;margin-bottom:4px;}
  .doc-guru ol{margin:0;padding-left:20px;}
  table.combo-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:18px;}
  table.combo-table th,table.combo-table td{border:1px solid #999;padding:1.5px 6px;text-align:left;}
  table.combo-table th{background:#eef2f6;font-size:11px;text-align:center;}
  table.combo-table td{line-height:1.1;}
  .doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-size:12.5px;}
  .doc-sign .line{border-top:1px solid #444;width:70%;margin:34px 0 6px;}
  .doc-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}
  .col-bil{width:26px;text-align:center;}
  .col-tkt{width:46px;text-align:center;}

  @media print{
    body *{visibility:hidden;}
    #printzone, #printzone *{visibility:visible;}
    #printzone{position:absolute;left:0;top:0;width:100%;padding:0;}
    .doc-wrap{border:none;padding:0;}
    .doc-actions{display:none;}
    table.combo-table{font-size:10.5px;}
    table.combo-table th,table.combo-table td{padding:1px 5px;}
    @page{margin:12mm;size:A4 portrait;}
  }

  #toast-box{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--navy-dark);color:#fff;padding:11px 18px;border-radius:8px;
    font-size:13.5px;max-width:88vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:999;
  }
  #toast-box.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media print{ #toast-box{display:none;} }
</style>
</head>

  const existing = new Set((state.draft.guru||[]).filter(Boolean).map(g => g.trim().toUpperCase()));
  return MASTER_TEACHERS
    .filter(t => bf === "semua" || t.bidang === bf)
    .filter(t => !existing.has(t.nama.trim().toUpperCase()))
    .sort((a,b) => a.bidang.localeCompare(b.bidang) || a.nama.localeCompare(b.nama));
}
function teacherBidangList(){
  return [...new Set(MASTER_TEACHERS.map(t=>t.bidang))].sort((a,b)=>a.localeCompare(b));
}

const HAS_STORAGE = (typeof window.storage !== "undefined" && window.storage !== null);
let storageWarned = false;

// ---- Backend kongsi (Google Apps Script) — pilihan, untuk capaian merentasi peranti ----
function apiUrl(){ return (state.settings && state.settings.apiUrl || "").trim(); }

async function apiListRecords(){
  const url = apiUrl();
  if(!url) return null;
  const res = await fetch(url, { method:"GET" });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "Gagal muat senarai");
  return data.records || [];
}
async function apiSaveRecord(record){
  const url = apiUrl();
  if(!url) return false;
  const res = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, // elak CORS preflight pada Apps Script
    body: JSON.stringify({ action:"save", record })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "Gagal simpan ke pelayan");
  return true;
}
async function apiDeleteRecord(id){
  const url = apiUrl();
  if(!url) return false;
  const res = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"delete", id })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "Gagal padam pada pelayan");
  return true;
}

async function loadAll(){
  if(HAS_STORAGE){
    try{
      const s = await window.storage.get(STORE_SETTINGS, false);
      state.settings = s ? JSON.parse(s.value) : defaultSettings();
    }catch(e){ state.settings = defaultSettings(); }
  } else {
    state.settings = defaultSettings();
  }
  if(!state.settings.apiUrl) state.settings.apiUrl = "";

  await refreshRecordsFromSource();

  state.loading = false;
  render();
  if(!HAS_STORAGE && !apiUrl()) showToast("Nota: dibuka di luar Claude tanpa Pautan API — borang disimpan untuk sesi ini sahaja.", 5000);
}

async function refreshRecordsFromSource(){
  if(apiUrl()){
    try{
      state.records = await apiListRecords();
      return;
    }catch(e){
      showToast("Gagal sambung ke Pautan API. Menggunakan storan tempatan buat sementara.", 4000);
    }
  }
  if(HAS_STORAGE){
    try{
      const r = await window.storage.get(STORE_RECORDS, false);
      state.records = r ? JSON.parse(r.value) : [];
    }catch(e){ state.records = state.records || []; }
  } else if(!state.records){
    state.records = [];
  }
}

async function persistRecords(){
  if(!HAS_STORAGE) return;
  try{
    await window.storage.set(STORE_RECORDS, JSON.stringify(state.records), false);
  }catch(e){ /* simpanan dalaman (state.records) masih kekal untuk sesi semasa */ }
}
async function persistSettings(){
  if(!HAS_STORAGE) return;
  try{
    await window.storage.set(STORE_SETTINGS, JSON.stringify(state.settings), false);
  }catch(e){ /* simpanan dalaman (state.settings) masih kekal untuk sesi semasa */ }
}

function showToast(msg, duration){
  let t = document.getElementById("toast-box");
  if(!t){
    t = document.createElement("div");
    t.id = "toast-box";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove("show"), duration || 2200);
}

function fmtTarikh(iso){
  if(!iso) return "—";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  const hari = HARI[d.getDay()];
  const bulan = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"][d.getMonth()];
  return hari + ", " + d.getDate() + " " + bulan + " " + d.getFullYear();
}

function esc(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Singkatkan nama kelas (Tkt) untuk cetakan, cth "3 Bangsawan" -> "3 BG".
// Kod khas untuk kelas yang disahkan; selainnya guna 2 huruf pertama sebagai lalai.
const TKT_ABBR_OVERRIDES = { "bangsawan":"BG", "muzikal":"MZ" };
function abbrTkt(tkt){
  if(!tkt) return "";
  const parts = tkt.trim().split(/\s+/);
  if(parts.length < 2) return tkt;
  const num = parts[0];
  const word = parts.slice(1).join(" ");
  const code = TKT_ABBR_OVERRIDES[word.toLowerCase()] || word.slice(0,2).toUpperCase();
  return num + " " + code;
}

/* ---------------- Actions ---------------- */
const app = {
  async goList(){
    state.view="list"; state.currentId=null; state.draft=null;
    render();
    await refreshRecordsFromSource();
    render();
  },
  async refreshList(){
    await refreshRecordsFromSource();
    render();
    showToast("Senarai dikemas kini.", 1500);
  },

  newRecord(){
    state.draft = blankRecord();
    state.view = "editor";
    render();
  },
  editRecord(id){
    const rec = state.records.find(r=>r.id===id);
    if(!rec) return;
    state.draft = JSON.parse(JSON.stringify(rec));
    state.view = "editor";
    render();
  },
  async duplicateRecord(id){
    const rec = state.records.find(r=>r.id===id);
    if(!rec) return;
    const copy = JSON.parse(JSON.stringify(rec));
    copy.id = uid();
    copy.tarikh = "";
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    state.records.unshift(copy);
    render();
    try{
      if(apiUrl()) await apiSaveRecord(copy);
      else persistRecords();
    }catch(e){ showToast("Gagal simpan salinan ke pelayan.", 3000); }
  },
  async deleteRecord(id){
    const rec = state.records.find(r=>r.id===id);
    if(!rec) return;
    if(!confirm("Padam borang untuk " + (rec.aktiviti||"aktiviti ini") + "? Tindakan ini tidak boleh diundur.")) return;
    state.records = state.records.filter(r=>r.id!==id);
    render();
    try{
      if(apiUrl()) await apiDeleteRecord(id);
      else persistRecords();
    }catch(e){ showToast("Gagal padam pada pelayan.", 3000); }
  },
  previewRecord(id){
    state.currentId = id;
    state.view = "preview";
    render();
  },

  updateDraft(field, value){ state.draft[field] = value; },

  removeGuru(i){ state.draft.guru.splice(i,1); if(state.draft.guru.length===0) state.draft.guru=[]; render(); },

  setGuruBidangFilter(val){ state.guruBidangFilter = val; render(); },
  addGuruFromMaster(){
    const sel = document.getElementById("select-guru");
    if(!sel || sel.value === "") return;
    const idx = parseInt(sel.value, 10);
    const t = getFilteredTeachers()[idx];
    if(!t) return;
    state.draft.guru = state.draft.guru.filter(Boolean);
    state.draft.guru.push(t.nama);
    render();
  },
  toggleManualGuru(){ state.manualOpen.guru = !state.manualOpen.guru; render(); },
  addManualGuru(){
    const el = document.getElementById("manual-nama-guru");
    const nama = (el.value||"").trim();
    if(!nama){ alert("Sila isi nama guru."); return; }
    state.draft.guru = state.draft.guru.filter(Boolean);
    state.draft.guru.push(nama);
    render();
  },

  removeStudent(kategori,i){ state.draft[kategori].splice(i,1); render(); },

  setTingkatanFilter(kategori, val){ state.filters[kategori].tingkatan = val; render(); },
  setBidangFilter(kategori, val){ state.filters[kategori].bidang = val; render(); },

  toggleCheck(kategori, nama){
    const arr = state.checked[kategori];
    const i = arr.indexOf(nama);
    if(i >= 0) arr.splice(i,1); else arr.push(nama);
    render();
  },
  checkAllVisible(kategori){
    const filtered = getFilteredMaster(kategori);
    state.checked[kategori] = filtered.map(s=>s.nama);
    render();
  },
  uncheckAll(kategori){
    state.checked[kategori] = [];
    render();
  },
  addCheckedToCategory(kategori){
    const names = new Set(state.checked[kategori]);
    if(names.size === 0) return;
    const toAdd = MASTER_STUDENTS.filter(s => names.has(s.nama));
    toAdd.forEach(s => state.draft[kategori].push({ nama: s.nama, tkt: s.tkt }));
    state.checked[kategori] = [];
    render();
  },

  toggleManual(kategori){
    state.manualOpen[kategori] = !state.manualOpen[kategori];
    render();
  },
  addManual(kategori){
    const namaEl = document.getElementById("manual-nama-"+kategori);
    const tktEl = document.getElementById("manual-tkt-"+kategori);
    const nama = (namaEl.value||"").trim();
    const tkt = (tktEl.value||"").trim();
    if(!nama){ alert("Sila isi nama murid."); return; }
    state.draft[kategori].push({ nama, tkt });
    render();
  },

  async saveDraft(){
    const d = state.draft;
    if(!d.tarikh){ alert("Sila isi tarikh aktiviti."); return; }
    if(!d.aktiviti.trim()){ alert("Sila isi nama aktiviti."); return; }
    d.guru = d.guru.map(g=>g.trim()).filter(Boolean);
    d.updatedAt = Date.now();
    const idx = state.records.findIndex(r=>r.id===d.id);
    if(idx>=0) state.records[idx]=d; else state.records.unshift(d);
    state.view="list"; state.draft=null;
    render();
    try{
      if(apiUrl()) await apiSaveRecord(d);
      else persistRecords();
      showToast("Borang berjaya disimpan.");
    }catch(e){
      showToast("Borang disimpan tempatan sahaja — gagal hantar ke pelayan.", 4000);
    }
  },
  cancelEdit(){
    if(!confirm("Buang perubahan yang belum disimpan?")) return;
    state.view="list"; state.draft=null; render();
  },

  previewDraft(){ state.view = "draftPreview"; render(); },
  backToEditor(){ state.view = "editor"; render(); },

  openSettings(){ state.view="settings"; render(); },
  saveSettingsForm(){
    persistSettings();
    state.view="list";
    render();
  },
  onLogoFile(input){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      state.settings.logo = reader.result;
      render();
    };
    reader.readAsDataURL(file);
  },
  removeLogo(){ state.settings.logo = null; render(); },

  doPrint(){
    const zone = document.getElementById("printzone");
    if(!zone){ alert("Tiada borang untuk dicetak."); return; }
    const styleTag = document.querySelector("style");
    const css = styleTag ? styleTag.innerHTML : "";
    const docHtml = zone.outerHTML;
    const fullHtml = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8">
      <title>Cetak Borang</title><style>${css}
      body{background:#fff;padding:20px;}
      </style></head><body>${docHtml}
      <script>window.onload=function(){ window.focus(); window.print(); };<\/script>
      </body></html>`;

    let win = null;
    try{ win = window.open("", "_blank"); }catch(e){ win = null; }

    if(win){
      win.document.open();
      win.document.write(fullHtml);
      win.document.close();
    } else {
      // Pop-up disekat oleh pelayar — cuba cetak terus sebagai gantian
      showToast("Pop-up disekat. Sila benarkan pop-up untuk pelayar ini supaya cetakan boleh dibuka dalam tab baharu.", 4000);
      window.print();
    }
  },

  setSearch(v){ state.search = v; render(); }
};
window.app = app;

/* ---------------- Renderers ---------------- */
function render(){
  const el = document.getElementById("app");
  if(state.loading){ el.innerHTML = "<p style='padding:40px;text-align:center;color:#5b6270;'>Memuatkan…</p>"; return; }
  let html = renderAppbar();
  html += `<div class="content-pad">`;
  if(state.view==="list") html += renderList();
  else if(state.view==="editor") html += renderEditor();
  else if(state.view==="preview") html += renderPreview();
  else if(state.view==="draftPreview") html += renderDraftPreview();
  else if(state.view==="settings") html += renderSettings();
  html += `</div>`;
  el.innerHTML = html;
  wireEditorInputs();
}

function renderList(){
  const q = state.search.trim().toLowerCase();
  let list = [...state.records].sort((a,b)=> (b.tarikh||"").localeCompare(a.tarikh||""));
  if(q){
    list = list.filter(r =>
      (r.aktiviti||"").toLowerCase().includes(q) ||
      (r.panitia||"").toLowerCase().includes(q) ||
      (r.tempat||"").toLowerCase().includes(q) ||
      (r.guru||[]).some(g=>g.toLowerCase().includes(q))
    );
  }
  let body;
  if(state.records.length===0){
    body = `<div class="empty"><b>Tiada borang lagi.</b><br>Tekan "+ Borang Baharu" untuk mula merekod aktiviti dan senarai murid.</div>`;
  } else if(list.length===0){
    body = `<div class="empty">Tiada borang sepadan dengan carian.</div>`;
  } else {
    body = list.map((r,idx)=>{
      const jumlah = (r.aspura||[]).length + (r.aspuri||[]).length;
      return `<div class="card-rec${idx%2?' alt':''}">
        <div class="top">
          <div>
            <div class="tarikh">${fmtTarikh(r.tarikh)}</div>
            <div class="aktiviti">${esc(r.aktiviti)||"<i style='color:#999'>(tiada nama aktiviti)</i>"}</div>
          </div>
          <span class="pill">${esc(r.panitia)}</span>
        </div>
        <div class="meta">
          <span>📍 ${esc(r.tempat)||"—"}</span>
          <span>🕒 ${esc(r.masa)||"—"}</span>
          <span>👥 ${jumlah} murid</span>
          <span>👨‍🏫 ${(r.guru||[]).filter(Boolean).length} guru</span>
        </div>
        <div class="actions">
          <button class="btn small secondary" onclick="app.previewRecord('${r.id}')">Lihat / Cetak</button>
          <button class="btn small secondary" onclick="app.editRecord('${r.id}')">Sunting</button>
          <button class="btn small ghost" onclick="app.duplicateRecord('${r.id}')">Salin</button>
          <button class="btn small danger outline" onclick="app.deleteRecord('${r.id}')">Padam</button>
        </div>
      </div>`;
    }).join("");
  }
  return `
    <div class="toolbar">
      <input type="search" placeholder="Cari aktiviti, panitia, tempat atau guru…" value="${esc(state.search)}" oninput="app.setSearch(this.value)">
      ${apiUrl() ? `<button class="btn small secondary" onclick="app.refreshList()" title="Tarik kemas kini terkini daripada guru lain">🔄 Muat Semula</button>` : ""}
    </div>
    ${apiUrl() ? `<div class="hint" style="margin:-8px 0 12px;">🔗 Mod kongsi aktif — semua guru yang guna Pautan API yang sama nampak senarai ini.</div>` : ""}
    ${body}
  `;
}

function renderEditor(){
  const d = state.draft;
  const guruList = d.guru.filter(Boolean);
  const guruRows = guruList.map((g,i)=>{
    const t = MASTER_TEACHERS.find(x=>x.nama.trim().toUpperCase()===g.trim().toUpperCase());
    return `<div class="stud-row">
      <span class="num">${i+1}.</span>
      <div class="stud-name">${esc(g)}</div>
      <div class="stud-tkt">${t?esc(t.bidang):"—"}</div>
      <button class="iconbtn" title="Buang" onclick="app.removeGuru(${i})">✕</button>
    </div>`;
  }).join("");
  const bf = state.guruBidangFilter || "semua";
  const filteredTeachers = getFilteredTeachers();
  const guruOptions = filteredTeachers.map((t,i)=>`<option value="${i}">${esc(t.nama)} — ${esc(t.bidang)}</option>`).join("");
  const guruManualOpen = !!state.manualOpen.guru;

  function studentBlock(kategori,label){
    const added = d[kategori]||[];
    const rows = added.map((s,i)=>`
      <div class="stud-row">
        <span class="num">${i+1}.</span>
        <div class="stud-name">${esc(s.nama)}</div>
        <div class="stud-tkt">${esc(s.tkt)||"—"}</div>
        <button class="iconbtn" title="Buang" onclick="app.removeStudent('${kategori}',${i})">✕</button>
      </div>`).join("");

    const f = state.filters[kategori] || { tingkatan:"semua", bidang:"semua" };
    const filtered = getFilteredMaster(kategori);
    const checkedSet = new Set(state.checked[kategori]);
    const manualOpen = !!state.manualOpen[kategori];

    const checklist = filtered.map(s=>`
      <label class="pick-row">
        <input type="checkbox" ${checkedSet.has(s.nama)?"checked":""} onchange="app.toggleCheck('${kategori}','${s.nama.replace(/'/g,"\\'")}')">
        <span class="pick-name">${esc(s.nama)}</span>
        <span class="pick-tkt">${esc(s.tkt)}</span>
      </label>`).join("");

    const checkedCount = state.checked[kategori].length;

    return `<div class="cat-block">
      <div class="cat-title"><span>${label} (${added.length})</span></div>
      ${rows || `<div class="hint" style="margin:0 0 8px;">Belum ada murid ditambah.</div>`}
      <div class="picker-row">
        <select class="tf-select" onchange="app.setTingkatanFilter('${kategori}',this.value)">
          <option value="semua" ${f.tingkatan==="semua"?"selected":""}>Semua Tingkatan</option>
          ${[1,2,3,4,5].map(t=>`<option value="${t}" ${f.tingkatan===String(t)?"selected":""}>Tingkatan ${t}</option>`).join("")}
        </select>
        <select class="tf-select" onchange="app.setBidangFilter('${kategori}',this.value)">
          <option value="semua" ${f.bidang==="semua"?"selected":""}>Semua Bidang</option>
          ${studentBidangList().map(b=>`<option value="${esc(b)}" ${f.bidang===b?"selected":""}>${esc(b)}</option>`).join("")}
        </select>
      </div>
      <div class="pick-toolbar">
        <span class="pick-count">${filtered.length} murid sepadan${checkedCount?` · ${checkedCount} ditanda`:""}</span>
        <div style="display:flex;gap:6px;">
          <button class="btn small ghost" onclick="app.checkAllVisible('${kategori}')" ${filtered.length===0?"disabled":""}>Tanda semua</button>
          <button class="btn small ghost" onclick="app.uncheckAll('${kategori}')" ${checkedCount===0?"disabled":""}>Kosongkan</button>
        </div>
      </div>
      <div class="pick-list">
        ${checklist || `<div class="hint" style="margin:8px 0;">— tiada murid sepadan —</div>`}
      </div>
      <button class="btn gold" style="width:100%;margin-top:8px;" onclick="app.addCheckedToCategory('${kategori}')" ${checkedCount===0?"disabled":""}>+ Tambah ${checkedCount||""} murid ditanda</button>
      <button class="addlink" style="margin-top:8px;" onclick="app.toggleManual('${kategori}')">${manualOpen?"– Tutup tambah manual":"+ Murid tiada dalam senarai?"}</button>
      ${manualOpen ? `
        <div class="manual-row">
          <input type="text" id="manual-nama-${kategori}" placeholder="Nama murid">
          <input type="text" id="manual-tkt-${kategori}" placeholder="Tingkatan (cth: 3 Bangsawan)">
          <button class="btn small secondary" onclick="app.addManual('${kategori}')">Tambah</button>
        </div>` : ""}
    </div>`;
  }

  return `
  <div class="section">
    <h2>Maklumat Aktiviti</h2>
    <div class="field">
      <label>Panitia</label>
      <input type="text" data-field="panitia" value="${esc(d.panitia)}" placeholder="cth: PANITIA SENI VISUAL">
    </div>
    <div class="field">
      <label>Nama Aktiviti</label>
      <textarea data-field="aktiviti" placeholder="cth: Persediaan Pertandingan Doodle SWM Environment Peringkat Kebangsaan">${esc(d.aktiviti)}</textarea>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Tarikh</label>
        <input type="date" data-field="tarikh" value="${esc(d.tarikh)}">
      </div>
      <div class="field">
        <label>Masa</label>
        <input type="text" data-field="masa" value="${esc(d.masa)}" placeholder="cth: 9.00 pagi – 12.30 t/hari">
      </div>
    </div>
    <div class="field">
      <label>Tempat</label>
      <input type="text" data-field="tempat" value="${esc(d.tempat)}" placeholder="cth: Studio Seni Visual">
    </div>
  </div>

  <div class="section">
    <h2>Guru Bertugas</h2>
    ${guruRows || `<div class="hint" style="margin:0 0 8px;">Belum ada guru ditambah.</div>`}
    <div class="picker-row">
      <select class="tf-select" onchange="app.setGuruBidangFilter(this.value)">
        <option value="semua" ${bf==="semua"?"selected":""}>Semua Bidang</option>
        ${teacherBidangList().map(b=>`<option value="${esc(b)}" ${bf===b?"selected":""}>${esc(b)}</option>`).join("")}
      </select>
      <select id="select-guru" class="stud-select">
        ${guruOptions || `<option value="">— tiada guru sepadan —</option>`}
      </select>
      <button class="btn small gold" onclick="app.addGuruFromMaster()" ${filteredTeachers.length===0?"disabled":""}>+ Tambah</button>
    </div>
    <button class="addlink" onclick="app.toggleManualGuru()">${guruManualOpen?"– Tutup tambah manual":"+ Guru tiada dalam senarai?"}</button>
    ${guruManualOpen ? `
      <div class="manual-row">
        <input type="text" id="manual-nama-guru" placeholder="Nama guru">
        <button class="btn small secondary" onclick="app.addManualGuru()">Tambah</button>
      </div>` : ""}
  </div>

  <div class="section">
    <h2>Senarai Murid</h2>
    <div class="hint">Pilih murid daripada senarai induk sekolah (ditapis ikut jantina secara automatik) — Aspura = Lelaki, Aspuri = Perempuan.</div>
    ${studentBlock('aspura','Aspura')}
    ${studentBlock('aspuri','Aspuri')}
  </div>

  <div class="section">
    <h2>Pengesahan</h2>
    <div class="grid2">
      <div>
        <div class="field">
          <label>Disediakan oleh (nama)</label>
          <div class="ac-wrap">
            <input type="text" id="disediakan-nama-input" data-field="disediakanNama" autocomplete="off" value="${esc(d.disediakanNama)}" placeholder="Taip nama guru…">
            <div id="disediakan-nama-suggest" class="ac-suggest"></div>
          </div>
        </div>
        <div class="field">
          <label>Jawatan</label>
          <input type="text" data-field="disediakanJawatan" value="${esc(d.disediakanJawatan)}">
        </div>
      </div>
      <div>
        <div class="field">
          <label>Diluluskan oleh (nama)</label>
          <input type="text" data-field="diluluskanNama" value="${esc(d.diluluskanNama)}" placeholder="Nama Pengetua">
        </div>
        <div class="field">
          <label>Jawatan</label>
          <input type="text" data-field="diluluskanJawatan" value="${esc(d.diluluskanJawatan)}">
        </div>
      </div>
    </div>
  </div>

  <div class="footbar">
    <button class="btn ghost" onclick="app.cancelEdit()">Batal</button>
    <button class="btn secondary" onclick="app.previewDraft()">👁️ Pratonton</button>
    <button class="btn gold" onclick="app.saveDraft()">Simpan Borang</button>
  </div>
  `;
}

function wireEditorInputs(){
  if(state.view!=="editor") return;
  document.querySelectorAll("[data-field]").forEach(inp=>{
    inp.addEventListener("input", ()=> app.updateDraft(inp.dataset.field, inp.value));
  });
  wireTeacherAutocomplete("disediakan-nama-input", "disediakan-nama-suggest", "disediakanNama");
}

function wireTeacherAutocomplete(inputId, suggestId, fieldName){
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestId);
  if(!input || !box) return;

  function renderSuggestions(){
    const q = input.value.trim().toLowerCase();
    if(!q){ box.classList.remove("show"); box.innerHTML=""; return; }
    const matches = MASTER_TEACHERS
      .filter(t => t.nama.toLowerCase().includes(q))
      .sort((a,b)=> a.nama.localeCompare(b.nama))
      .slice(0, 8);
    if(matches.length === 0){
      box.innerHTML = `<div class="ac-empty">Tiada guru sepadan dalam senarai — nama akan disimpan seperti ditaip.</div>`;
    } else {
      box.innerHTML = matches.map(t =>
        `<div class="ac-item" data-nama="${esc(t.nama)}">${esc(t.nama)}<span class="ac-bidang">${esc(t.bidang)}</span></div>`
      ).join("");
    }
    box.classList.add("show");
  }

  input.addEventListener("input", renderSuggestions);
  input.addEventListener("focus", renderSuggestions);
  box.addEventListener("mousedown", (e)=>{
    const item = e.target.closest(".ac-item");
    if(!item) return;
    e.preventDefault();
    input.value = item.dataset.nama;
    app.updateDraft(fieldName, item.dataset.nama);
    box.classList.remove("show");
  });
  input.addEventListener("blur", ()=> setTimeout(()=> box.classList.remove("show"), 120));
}

function renderRecordDoc(r){
  const s = state.settings;
  const logoHtml = s.logo ? `<img src="${s.logo}" alt="logo">` : `<div class="logo-placeholder">LOGO</div>`;

  const aspura = r.aspura || [];
  const aspuri = r.aspuri || [];
  const rowCount = Math.max(aspura.length, aspuri.length, 1);
  let comboRows = "";
  for(let i=0; i<rowCount; i++){
    const l = aspura[i];
    const rgt = aspuri[i];
    comboRows += `<tr>
      <td class="col-bil">${l?i+1:""}</td><td>${l?esc(l.nama):""}</td><td class="col-tkt">${l?esc(abbrTkt(l.tkt)):""}</td>
      <td class="col-bil">${rgt?i+1:""}</td><td>${rgt?esc(rgt.nama):""}</td><td class="col-tkt">${rgt?esc(abbrTkt(rgt.tkt)):""}</td>
    </tr>`;
  }
  if(aspura.length===0 && aspuri.length===0){
    comboRows = `<tr><td colspan="6" style="color:#999;text-align:center;">Tiada murid direkodkan</td></tr>`;
  }

  return `
  <div class="doc-wrap" id="printzone">
    <div class="doc-head">
      ${logoHtml}
      <div>
        <div class="school-name">${esc(s.schoolName)}</div>
        <div class="school-sub">${esc(s.schoolSub)}</div>
        <div class="school-addr">${esc(s.address)}<br>TEL: ${esc(s.tel)} &nbsp;&nbsp; FAX: ${esc(s.fax)}</div>
      </div>
    </div>
    <div class="doc-panitia">${esc(r.panitia)||"—"}</div>
    <div class="doc-desc">Senarai nama pelajar Sekolah Seni Malaysia Johor yang tinggal di asrama Aspura / Aspuri untuk menghadiri mesyuarat / aktiviti / kelas gantian / kelas tambahan.</div>
    <div class="doc-meta">
      <div class="k">Tarikh</div><div>: ${fmtTarikh(r.tarikh)}</div>
      <div class="k">Masa</div><div>: ${esc(r.masa)||"—"}</div>
      <div class="k">Tempat</div><div>: ${esc(r.tempat)||"—"}</div>
      <div class="k">Aktiviti</div><div>: ${esc(r.aktiviti)||"—"}</div>
    </div>
    <div class="doc-guru">
      <b>Guru bertugas:</b>
      <ol>${(r.guru||[]).filter(Boolean).map(g=>`<li>${esc(g)}</li>`).join("") || "<li>—</li>"}</ol>
    </div>
    <table class="combo-table">
      <thead>
        <tr>
          <th class="col-bil">Bil.</th><th>Senarai nama di Aspura</th><th class="col-tkt">Tkt.</th>
          <th class="col-bil">Bil.</th><th>Senarai nama di Aspuri</th><th class="col-tkt">Tkt.</th>
        </tr>
      </thead>
      <tbody>${comboRows}</tbody>
    </table>
    <div class="doc-sign">
      <div>
        Disediakan oleh:
        <div class="line"></div>
        <b>${esc(r.disediakanNama)||"—"}</b><br>
        ${esc(r.disediakanJawatan)}<br>
        ${esc(s.schoolName)}
      </div>
      <div>
        Diluluskan oleh:
        <div class="line"></div>
        <b>${esc(r.diluluskanNama)||"—"}</b><br>
        ${esc(r.diluluskanJawatan)}<br>
        ${esc(s.schoolName)}
      </div>
    </div>
  </div>
  `;
}

function renderPreview(){
  const r = state.records.find(x=>x.id===state.currentId);
  if(!r) return `<div class="empty">Borang tidak dijumpai.</div>`;
  return `
  <div class="doc-actions">
    <button class="btn secondary" onclick="app.editRecord('${r.id}')">Sunting</button>
    <button class="btn gold" onclick="app.doPrint()">🖨️ Cetak</button>
  </div>
  ${renderRecordDoc(r)}
  `;
}

function renderDraftPreview(){
  const r = state.draft;
  if(!r) return `<div class="empty">Tiada borang sedang disunting.</div>`;
  return `
  <div class="doc-actions">
    <button class="btn secondary" onclick="app.backToEditor()">← Kembali Sunting</button>
    <button class="btn gold" onclick="app.doPrint()">🖨️ Cetak</button>
  </div>
  <div class="hint" style="margin-bottom:10px;">Ini pratonton borang sebelum disimpan. Tekan "Kembali Sunting" untuk teruskan mengisi, atau cetak terus dari sini.</div>
  ${renderRecordDoc(r)}
  `;
}

  const s = state.settings;
  const logoPreview = s.logo
    ? `<img class="logo-preview" src="${s.logo}">`
    : `<div class="logo-placeholder">TIADA LOGO</div>`;
  return `
  <div class="section">
    <h2>Perkongsian Data Merentasi Peranti</h2>
    <div class="hint" style="margin:0 0 10px;">
      Secara lalai, borang cuma tersimpan untuk akaun/sesi awak sendiri. Untuk guru lain nampak borang yang sama dari peranti masing-masing, sediakan "Google Apps Script Web App" (percuma) dan tampal pautannya di bawah. Minta pautan ini daripada admin/pencipta sistem sekali sahaja untuk seluruh sekolah.
    </div>
    <div class="field">
      <label>Pautan API (Google Apps Script Web App)</label>
      <input type="text" id="set-apiurl" value="${esc(s.apiUrl)}" placeholder="https://script.google.com/macros/s/xxxxx/exec">
    </div>
    <div class="hint" style="margin:0;">
      Kosongkan medan ini untuk kembali guna storan tempatan (tidak dikongsi).
    </div>
  </div>
  <div class="section">
    <h2>Tetapan Sekolah (letterhead cetakan)</h2>
    <div class="field">
      <label>Nama Sekolah</label>
      <input type="text" id="set-name" value="${esc(s.schoolName)}">
    </div>
    <div class="field">
      <label>Sub-tajuk</label>
      <input type="text" id="set-sub" value="${esc(s.schoolSub)}">
    </div>
    <div class="field">
      <label>Alamat</label>
      <textarea id="set-addr">${esc(s.address)}</textarea>
    </div>
    <div class="grid2">
      <div class="field"><label>Tel</label><input type="text" id="set-tel" value="${esc(s.tel)}"></div>
      <div class="field"><label>Fax</label><input type="text" id="set-fax" value="${esc(s.fax)}"></div>
    </div>
    <div class="field">
      <label>Logo (untuk cetakan)</label>
      <div class="logo-row">
        ${logoPreview}
        <div>
          <input type="file" accept="image/*" onchange="app.onLogoFile(this)"><br>
          ${s.logo ? `<button class="btn small ghost" style="margin-top:6px;" onclick="app.removeLogo()">Buang logo</button>` : ""}
        </div>
      </div>
    </div>
  </div>
  <div class="footbar">
    <button class="btn ghost" onclick="app.goList()">Batal</button>
    <button class="btn gold" onclick="collectSettingsAndSave()">Simpan Tetapan</button>
  </div>
  `;
}
function collectSettingsAndSave(){
  state.settings.schoolName = document.getElementById("set-name").value;
  state.settings.schoolSub = document.getElementById("set-sub").value;
  state.settings.address = document.getElementById("set-addr").value;
  state.settings.tel = document.getElementById("set-tel").value;
  state.settings.fax = document.getElementById("set-fax").value;
  state.settings.apiUrl = document.getElementById("set-apiurl").value.trim();
  app.saveSettingsForm();
  refreshRecordsFromSource().then(render);
}

loadAll();
</script>
